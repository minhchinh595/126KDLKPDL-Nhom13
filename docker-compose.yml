services:
  postgres:
    image: postgres:16-alpine
    container_name: electricity-analytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electricity_analytics_db}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the project .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - electricity_analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  electricity_analytics_postgres_data:
    name: electricity_analytics_postgres_data
